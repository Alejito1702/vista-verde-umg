package vistaverde.ui;

import vistaverde.modelos.*;
import javax.swing.*;
import java.awt.*;

/**
 * Pantalla 4 — Registro de Pago de Cuota.
 * Permite al administrador registrar el pago mensual de una casa.
 *
 * Validaciones:
 *  - No se permite pago duplicado del mismo mes/año en la misma casa.
 *  - No se permite pagar un mes si hay meses anteriores pendientes en el mismo año.
 *  - El monto es automático (cuota vigente, no editable).
 */
public class RegistroPago extends VistaBase {

    private JComboBox<String> cmbCasa, cmbMes, cmbAnio;
    private JTextField txtNombreProp, txtMonto;

    public RegistroPago(JFrame menuRef) {
        super("Registro de Pago", menuRef);

        JPanel fondo = crearPanelFondo();
        fondo.setLayout(new BorderLayout());

        JPanel top = new JPanel(new FlowLayout(FlowLayout.CENTER));
        top.setOpaque(false);
        top.setBorder(BorderFactory.createEmptyBorder(20, 0, 0, 0));
        top.add(lblTitulo("💳  Registro de Pago"));
        fondo.add(top, BorderLayout.NORTH);

        JPanel form = new JPanel();
        form.setLayout(new BoxLayout(form, BoxLayout.Y_AXIS));
        form.setOpaque(false);
        form.setBorder(BorderFactory.createEmptyBorder(20, 40, 10, 40));

        String[] casas = new String[31];
        casas[0] = "Seleccione casa";
        for (int i = 1; i <= 30; i++) casas[i] = String.valueOf(i);
        cmbCasa = styledCombo(casas);
        cmbCasa.addActionListener(e -> cargarPropietario());

        cmbMes  = styledCombo(Condominio.MESES);
        cmbAnio = styledCombo(new String[]{"2026","2025","2024","2023"});

        txtNombreProp = styledField();
        txtNombreProp.setEditable(false);
        txtNombreProp.setText("—");

        txtMonto = styledField();
        txtMonto.setEditable(false);
        actualizarMonto();

        form.add(filaForm("No. de Casa:",    cmbCasa));
        form.add(Box.createVerticalStrut(10));
        form.add(filaForm("Propietario:",    txtNombreProp));
        form.add(Box.createVerticalStrut(10));
        form.add(filaForm("Mes:",            cmbMes));
        form.add(Box.createVerticalStrut(10));
        form.add(filaForm("Año:",            cmbAnio));
        form.add(Box.createVerticalStrut(10));
        form.add(filaForm("Cuota mensual:",  txtMonto));
        fondo.add(form, BorderLayout.CENTER);

        JPanel bot = new JPanel(new FlowLayout(FlowLayout.CENTER, 20, 15));
        bot.setOpaque(false);
        JButton btnReg = btnPrincipal("Registrar Pago");
        btnReg.addActionListener(e -> registrar());
        bot.add(btnReg);
        bot.add(btnRegresar());
        fondo.add(bot, BorderLayout.SOUTH);

        setContentPane(fondo);
    }

    /** Actualiza el campo de monto con la cuota vigente */
    private void actualizarMonto() {
        txtMonto.setText(String.format("Q%.2f", Condominio.getInstance().getCuotaMensual()));
    }

    /** Carga el nombre del propietario de la casa seleccionada */
    private void cargarPropietario() {
        if (cmbCasa.getSelectedIndex() == 0) { txtNombreProp.setText("—"); return; }
        int n = Integer.parseInt(cmbCasa.getSelectedItem().toString());
        Casa c = Condominio.getInstance().buscarCasa(n);
        txtNombreProp.setText(c.tienePropietario()
            ? c.getPropietario().getNombreCompleto() : "(sin propietario)");
        actualizarMonto();
    }

    /** Valida y registra el pago */
    private void registrar() {
        if (cmbCasa.getSelectedIndex() == 0) { mostrarError("Seleccione una casa."); return; }

        int    n    = Integer.parseInt(cmbCasa.getSelectedItem().toString());
        String mes  = cmbMes.getSelectedItem().toString();
        String anio = cmbAnio.getSelectedItem().toString();
        Condominio cond = Condominio.getInstance();

        // Validación 1: pago duplicado
        if (cond.existePago(n, mes, anio)) {
            mostrarError("La casa " + n + " ya tiene registrado el pago de "
                + mes + " " + anio + ".\nNo se permiten pagos duplicados.");
            return;
        }

        // Validación 2: meses anteriores pendientes
        if (cond.tienePendientesAnteriores(n, mes, anio)) {
            mostrarError("No se puede registrar el pago de " + mes + " " + anio
                + " para la Casa " + n + ".\n"
                + "Tiene meses anteriores pendientes de pago en " + anio + ".");
            return;
        }

        Casa casa = cond.buscarCasa(n);
        Pago pago = new Pago(cond.getCuotaMensual(), mes, anio, casa);
        cond.agregarPago(pago);

        mostrarOk("Pago registrado exitosamente.\n"
            + "Casa: " + n + "   |   Mes: " + mes + " " + anio
            + "\nMonto: Q" + String.format("%.2f", cond.getCuotaMensual()));

        cmbCasa.setSelectedIndex(0);
        txtNombreProp.setText("—");
        actualizarMonto();
    }
}
