package vistaverde.ui;

import javax.swing.*;
import javax.swing.border.*;
import java.awt.*;
import java.awt.event.*;
import java.time.LocalDate;
import java.time.format.DateTimeFormatter;
import java.util.Locale;

public class MenuPrincipal extends JFrame {

    public MenuPrincipal() {
        initComponents();
    }

    private void initComponents() {
        setTitle("Vista Verde - Menú Principal");
        setMinimumSize(new Dimension(650, 450));
        setSize(900, 600);
        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);
        setLocationRelativeTo(null);
        setResizable(true);

        JPanel panelPrincipal = new JPanel(new BorderLayout()) {
            @Override protected void paintComponent(Graphics g) {
                super.paintComponent(g);
                Graphics2D g2d = (Graphics2D) g;
                g2d.setPaint(new GradientPaint(0,0,new Color(10,30,15),0,getHeight(),new Color(15,50,25)));
                g2d.fillRect(0,0,getWidth(),getHeight());
            }
        };

        // ── Header ──
        JPanel panelHeader = new JPanel(new BorderLayout()) {
            @Override protected void paintComponent(Graphics g) {
                super.paintComponent(g);
                Graphics2D g2d = (Graphics2D) g;
                g2d.setPaint(new GradientPaint(0,0,new Color(20,80,40),getWidth(),0,new Color(10,50,20)));
                g2d.fillRect(0,0,getWidth(),getHeight());
            }
        };
        panelHeader.setPreferredSize(new Dimension(0, 90));
        panelHeader.setBorder(new EmptyBorder(15, 30, 15, 30));

        JLabel lblNombre = new JLabel("Condominio Vista Verde");
        lblNombre.setFont(new Font("Segoe UI", Font.BOLD, 26));
        lblNombre.setForeground(new Color(144,238,144));

        JPanel panelInfo = new JPanel(new GridLayout(2, 1));
        panelInfo.setOpaque(false);

        JLabel lblBienvenida = new JLabel("Bienvenido");
        lblBienvenida.setFont(new Font("Segoe UI", Font.PLAIN, 13));
        lblBienvenida.setForeground(new Color(180,230,180));
        lblBienvenida.setHorizontalAlignment(SwingConstants.RIGHT);

        LocalDate hoy = LocalDate.now();
        String fechaTexto = hoy.format(DateTimeFormatter.ofPattern("MMMM yyyy", new Locale("es","GT")));
        fechaTexto = fechaTexto.substring(0,1).toUpperCase() + fechaTexto.substring(1);

        JLabel lblFecha = new JLabel(fechaTexto);
        lblFecha.setFont(new Font("Segoe UI", Font.BOLD, 13));
        lblFecha.setForeground(new Color(144,238,144));
        lblFecha.setHorizontalAlignment(SwingConstants.RIGHT);

        panelInfo.add(lblBienvenida);
        panelInfo.add(lblFecha);
        panelHeader.add(lblNombre, BorderLayout.WEST);
        panelHeader.add(panelInfo,  BorderLayout.EAST);

        // ── Grid de botones ──
        JPanel panelBotones = new JPanel(new GridLayout(2, 3, 20, 20));
        panelBotones.setOpaque(false);
        panelBotones.setBorder(new EmptyBorder(30, 50, 30, 50));

        String[][] datos = {
            {"👤","Registro de","Propietario"},
            {"💳","Registro","de Pago"},
            {"⚙️","Configuración","de Cuota"},
            {"📋","Estado de","Cuenta"},
            {"📊","Reporte","General"},
            {"🏠","Casas","Morosas"},
        };

        Runnable[] acciones = {
            () -> new RegistroPropietario(this).setVisible(true),
            () -> new RegistroPago(this).setVisible(true),
            () -> new ConfiguracionCuota(this).setVisible(true),
            () -> new EstadoCuenta(this).setVisible(true),
            () -> new ReporteGeneral(this).setVisible(true),
            () -> new CasasMorosas(this).setVisible(true),
        };

        for (int i = 0; i < datos.length; i++) {
            final Runnable accion = acciones[i];
            JButton btn = crearBoton(datos[i][0], datos[i][1], datos[i][2]);
            btn.addActionListener(e -> accion.run());
            panelBotones.add(btn);
        }

        // ── Footer ──
        JPanel panelFooter = new JPanel(new FlowLayout(FlowLayout.RIGHT));
        panelFooter.setOpaque(false);
        panelFooter.setBorder(new EmptyBorder(0, 0, 15, 30));

        JButton btnCerrar = new JButton("Cerrar sesión") {
            @Override protected void paintComponent(Graphics g) {
                Graphics2D g2 = (Graphics2D) g.create();
                g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                g2.setColor(new Color(180,40,40));
                g2.fillRoundRect(0,0,getWidth(),getHeight(),20,20);
                g2.dispose();
                super.paintComponent(g);
            }
        };
        btnCerrar.setFont(new Font("Segoe UI", Font.BOLD, 12));
        btnCerrar.setForeground(Color.WHITE);
        btnCerrar.setContentAreaFilled(false);
        btnCerrar.setBorderPainted(false);
        btnCerrar.setFocusPainted(false);
        btnCerrar.setCursor(new Cursor(Cursor.HAND_CURSOR));
        btnCerrar.setPreferredSize(new Dimension(130, 35));
        btnCerrar.addActionListener(e -> { new LoginUI().setVisible(true); dispose(); });
        btnCerrar.addMouseListener(new MouseAdapter() {
            @Override public void mouseEntered(MouseEvent e) { btnCerrar.setForeground(new Color(255,180,180)); btnCerrar.repaint(); }
            @Override public void mouseExited (MouseEvent e) { btnCerrar.setForeground(Color.WHITE);           btnCerrar.repaint(); }
        });
        panelFooter.add(btnCerrar);

        panelPrincipal.add(panelHeader,  BorderLayout.NORTH);
        panelPrincipal.add(panelBotones, BorderLayout.CENTER);
        panelPrincipal.add(panelFooter,  BorderLayout.SOUTH);
        setContentPane(panelPrincipal);

        addComponentListener(new ComponentAdapter() {
            @Override public void componentResized(ComponentEvent e) {
                int a = getWidth();
                int t = a < 750 ? 11 : a < 900 ? 13 : 15;
                for (Component c : panelBotones.getComponents()) {
                    if (c instanceof JButton btn) {
                        for (Component inner : btn.getComponents()) {
                            if (inner instanceof JLabel lbl) {
                                lbl.setFont(new Font(lbl.getFont().getName(), lbl.getFont().getStyle(), t));
                            }
                        }
                    }
                }
                lblNombre.setFont(new Font("Segoe UI", Font.BOLD, a < 750 ? 18 : a < 900 ? 22 : 26));
                repaint();
            }
        });
    }

    private JButton crearBoton(String icono, String linea1, String linea2) {
        JButton btn = new JButton() {
            @Override protected void paintComponent(Graphics g) {
                Graphics2D g2 = (Graphics2D) g.create();
                g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                g2.setColor(getBackground());
                g2.fillRoundRect(0,0,getWidth(),getHeight(),16,16);
                g2.setColor(new Color(50,180,80,60));
                g2.setStroke(new BasicStroke(1.5f));
                g2.drawRoundRect(1,1,getWidth()-2,getHeight()-2,16,16);
                g2.dispose();
                super.paintComponent(g);
            }
        };
        btn.setBackground(new Color(20,70,35));
        btn.setLayout(new BoxLayout(btn, BoxLayout.Y_AXIS));
        btn.setContentAreaFilled(false);
        btn.setBorderPainted(false);
        btn.setFocusPainted(false);
        btn.setCursor(new Cursor(Cursor.HAND_CURSOR));

        JLabel lIco = new JLabel(icono);
        lIco.setFont(new Font("Segoe UI Emoji", Font.PLAIN, 28));
        lIco.setAlignmentX(Component.CENTER_ALIGNMENT);

        JLabel lL1 = new JLabel(linea1);
        lL1.setFont(new Font("Segoe UI", Font.BOLD, 13));
        lL1.setForeground(new Color(144,238,144));
        lL1.setAlignmentX(Component.CENTER_ALIGNMENT);

        JLabel lL2 = new JLabel(linea2);
        lL2.setFont(new Font("Segoe UI", Font.PLAIN, 12));
        lL2.setForeground(new Color(100,200,120));
        lL2.setAlignmentX(Component.CENTER_ALIGNMENT);

        btn.add(Box.createVerticalGlue());
        btn.add(lIco);
        btn.add(Box.createVerticalStrut(8));
        btn.add(lL1);
        btn.add(lL2);
        btn.add(Box.createVerticalGlue());

        btn.addMouseListener(new MouseAdapter() {
            @Override public void mouseEntered(MouseEvent e) { btn.setBackground(new Color(30,110,55)); btn.repaint(); }
            @Override public void mouseExited (MouseEvent e) { btn.setBackground(new Color(20,70,35));  btn.repaint(); }
        });
        return btn;
    }

    public static void main(String[] args) {
        SwingUtilities.invokeLater(() -> new LoginUI().setVisible(true));
    }
}
