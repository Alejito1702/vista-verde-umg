package vistaverde.ui;

import vistaverde.modelos.*;
import javax.swing.*;
import javax.swing.table.*;
import java.awt.*;
import java.util.ArrayList;

/**
 * Pantalla 7 — Reporte General.
 * Muestra en JTable las 30 casas con:
 *   - Número de casa, propietario, estado del mes actual (Pagado/Pendiente)
 *   - Total pagado en el año actual.
 * Al pie muestra total recaudado del mes vs total esperado.
 */
public class ReporteGeneral extends VistaBase {

    public ReporteGeneral(JFrame menuRef) {
        super("Reporte General", menuRef);
        setSize(650, 560);

        Condominio cond      = Condominio.getInstance();
        String     mesActual = cond.getMesActual();
        // Capitalizar primera letra del mes
        mesActual = mesActual.substring(0,1).toUpperCase() + mesActual.substring(1);
        String     anioActual = cond.getAnioActual();

        JPanel fondo = crearPanelFondo();
        fondo.setLayout(new BorderLayout(10, 10));

        // ── Título ──
        JPanel top = new JPanel(new FlowLayout(FlowLayout.CENTER));
        top.setOpaque(false);
        top.setBorder(BorderFactory.createEmptyBorder(18, 0, 0, 0));
        top.add(lblTitulo("📊  Reporte General — " + mesActual + " " + anioActual));
        fondo.add(top, BorderLayout.NORTH);

        // ── Tabla ──
        String[] cols = {"Casa", "Propietario", "Estado " + mesActual, "Total Pagado " + anioActual};
        DefaultTableModel model = new DefaultTableModel(cols, 0) {
            @Override public boolean isCellEditable(int r, int c) { return false; }
        };

        ArrayList<Casa> casas = cond.getCasas();
        double totalMes = 0;
        int casasPagaron = 0;

        for (Casa c : casas) {
            String prop    = c.tienePropietario() ? c.getPropietario().getNombreCompleto() : "—";
            boolean pago   = c.yaPago(mesActual, anioActual);
            String estado  = pago ? "✔ Pagado" : "✗ Pendiente";
            double totAnio = c.getTotalPagadoAnio(anioActual);
            model.addRow(new Object[]{c.getNumeroCasa(), prop, estado,
                String.format("Q%.2f", totAnio)});
            if (pago) { totalMes += cond.getCuotaMensual(); casasPagaron++; }
        }

        JTable tabla = new JTable(model);
        tabla.setBackground(new Color(15,45,25));
        tabla.setForeground(Color.WHITE);
        tabla.setFont(new Font("Segoe UI", Font.PLAIN, 12));
        tabla.setGridColor(new Color(50,120,60));
        tabla.setRowHeight(22);
        tabla.getTableHeader().setBackground(new Color(20,70,35));
        tabla.getTableHeader().setForeground(GREEN_LITE);

        // Colorear filas según estado
        final String mesF = mesActual, anioF = anioActual;
        tabla.setDefaultRenderer(Object.class, new DefaultTableCellRenderer() {
            @Override public Component getTableCellRendererComponent(
                    JTable t, Object v, boolean sel, boolean foc, int row, int col) {
                super.getTableCellRendererComponent(t, v, sel, foc, row, col);
                String est = (String) t.getValueAt(row, 2);
                boolean morosa = est.startsWith("✗");
                setBackground(morosa ? new Color(70,15,15) : new Color(15,45,25));
                setForeground(morosa ? new Color(255,130,130) : Color.WHITE);
                setBorder(BorderFactory.createEmptyBorder(0,4,0,4));
                return this;
            }
        });

        JScrollPane scroll = new JScrollPane(tabla);
        scroll.getViewport().setBackground(new Color(15,45,25));
        scroll.setBorder(BorderFactory.createLineBorder(GREEN_BORD));

        // ── Pie con totales ──
        double totalEsperado = cond.getCuotaMensual() * Condominio.TOTAL_CASAS;
        double pendienteMes  = totalEsperado - totalMes;

        JTextArea pie = new JTextArea();
        pie.setEditable(false);
        pie.setBackground(new Color(20,70,35));
        pie.setForeground(GREEN_LITE);
        pie.setFont(new Font("Segoe UI", Font.BOLD, 12));
        pie.setBorder(BorderFactory.createEmptyBorder(8,14,8,14));
        pie.setText(
            "Casas que pagaron " + mesActual + ": " + casasPagaron + " / " + Condominio.TOTAL_CASAS
            + "   |   Recaudado: Q" + String.format("%.2f", totalMes)
            + "   |   Esperado: Q"  + String.format("%.2f", totalEsperado)
            + "\nPendiente de cobro en " + mesActual + ": Q" + String.format("%.2f", pendienteMes));

        JPanel centro = new JPanel(new BorderLayout(0, 6));
        centro.setOpaque(false);
        centro.setBorder(BorderFactory.createEmptyBorder(0, 16, 0, 16));
        centro.add(scroll, BorderLayout.CENTER);
        centro.add(pie,    BorderLayout.SOUTH);
        fondo.add(centro, BorderLayout.CENTER);

        JPanel bot = new JPanel(new FlowLayout(FlowLayout.RIGHT, 20, 8));
        bot.setOpaque(false);
        bot.add(btnRegresar());
        fondo.add(bot, BorderLayout.SOUTH);

        setContentPane(fondo);
    }
}
